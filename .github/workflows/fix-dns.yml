name: Fix zonewise.ai DNS → Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  fix-dns:
    runs-on: ubuntu-latest
    env:
      ZONE_ID: b32406b78aaaefd55557d77c843a5940
    steps:
      - name: Discover zones and current state
        continue-on-error: true
        run: |
          set +e
          echo "=== Zones accessible to this token ==="
          curl -s "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq '.result[] | {id, name, status}' || echo "No zones or no permission"

          echo ""
          echo "=== Pages project domains ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/zonewise-web/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq '.' || echo "Failed"

          echo ""
          echo "=== Current DNS for zonewise.ai ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=zonewise.ai" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq '.' || echo "Failed"

      - name: Delete old Vercel DNS records
        continue-on-error: true
        run: |
          set +e
          RECORDS=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=zonewise.ai" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -r '.result[]? | select(.type == "A" or .type == "CNAME") | .id')
          for ID in $RECORDS; do
            echo "Deleting $ID..."
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq '{success}'
          done
          WWW=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=www.zonewise.ai" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -r '.result[]? | select(.type == "A" or .type == "CNAME") | .id')
          for ID in $WWW; do
            echo "Deleting www $ID..."
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq '{success}'
          done

      - name: Create CNAME to Cloudflare Pages
        continue-on-error: true
        run: |
          set +e
          echo "Creating root CNAME..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"zonewise.ai","content":"zonewise-web.pages.dev","proxied":true,"ttl":1}' | jq '.'
          echo ""
          echo "Creating www CNAME..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"www","content":"zonewise-web.pages.dev","proxied":true,"ttl":1}' | jq '.'

      - name: Verify
        continue-on-error: true
        run: |
          sleep 15
          echo "=== DNS ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq '.result[]? | {name, content, proxied}' || true
          echo ""
          echo "=== Pages Domains ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/zonewise-web/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq '.result[]? | {name, status}' || true
