# Upstream Sync + Release Docs + Telegram Notify
# Syncs lukilabs/craft-agents-oss → breverdbidder/zonewise-desktop
# Schedule: every 6 hours + manual trigger
# Notifies: Telegram, zonewise-web, Supabase

name: Sync Upstream Craft Agents

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if already current'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  UPSTREAM_REPO: lukilabs/craft-agents-oss

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
      behind_count: ${{ steps.detect.outputs.behind_count }}
      fork_version: ${{ steps.detect.outputs.fork_version }}
      has_new_release: ${{ steps.detect.outputs.has_new_release }}
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "ZoneWise Sync Bot"
          git config user.email "sync@zonewise.ai"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git 2>/dev/null || true
          git fetch upstream --tags

      - name: Detect Upstream Status
        id: detect
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo "0")
          UPSTREAM_TAG=$(curl -s "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest" | jq -r '.tag_name // "unknown"')
          FORK_VERSION=$(cat package.json | jq -r '.version // "unknown"')

          # Check if upstream tag is newer than fork version
          HAS_NEW_RELEASE="false"
          if [ "$UPSTREAM_TAG" != "unknown" ] && [ "$UPSTREAM_TAG" != "v$FORK_VERSION" ]; then
            HAS_NEW_RELEASE="true"
          fi

          echo "behind_count=$BEHIND" >> $GITHUB_OUTPUT
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "fork_version=$FORK_VERSION" >> $GITHUB_OUTPUT
          echo "has_new_release=$HAS_NEW_RELEASE" >> $GITHUB_OUTPUT

          echo "Upstream tag: $UPSTREAM_TAG"
          echo "Fork version: $FORK_VERSION"
          echo "Commits behind: $BEHIND"
          echo "New release: $HAS_NEW_RELEASE"

      - name: Sync Upstream
        id: sync
        run: |
          BEHIND=${{ steps.detect.outputs.behind_count }}

          if [ "$BEHIND" = "0" ] && [ "${{ github.event.inputs.force_sync }}" != "true" ]; then
            echo "Already in sync. Skipping."
            echo "synced=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Syncing $BEHIND commits from upstream..."
          git checkout main

          if git merge upstream/main --no-edit -m "sync: upstream ${{ steps.detect.outputs.upstream_tag }}"; then
            git push origin main
            echo "synced=true" >> $GITHUB_OUTPUT
            echo "Clean merge complete."
          else
            echo "Merge conflict detected. Auto-resolving..."
            # Keep our branding/custom files, take upstream for core packages
            git checkout --ours zonewise/ BRAND_COLORS.md docs/ 2>/dev/null || true
            git checkout --theirs packages/ apps/electron/src/ 2>/dev/null || true
            git add -A
            git commit --no-edit -m "sync: upstream ${{ steps.detect.outputs.upstream_tag }} (auto-resolved)" || true
            git push origin main
            echo "synced=true" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json version
        if: steps.sync.outputs.synced == 'true'
        run: |
          UPSTREAM_TAG="${{ steps.detect.outputs.upstream_tag }}"
          VERSION="${UPSTREAM_TAG#v}"
          if [ "$VERSION" != "unknown" ] && [ -n "$VERSION" ]; then
            jq --arg v "$VERSION" '.version = $v' package.json > package.tmp && mv package.tmp package.json
            git add package.json
            git commit -m "chore: bump version to $VERSION (upstream sync)" || true
            git push origin main || true
          fi

      - name: Summary
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Upstream: ${{ steps.detect.outputs.upstream_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Fork was: v${{ steps.detect.outputs.fork_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Behind: ${{ steps.detect.outputs.behind_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Synced: ${{ steps.sync.outputs.synced }}" >> $GITHUB_STEP_SUMMARY

  release-doc:
    needs: sync
    if: needs.sync.outputs.synced == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "ZoneWise Sync Bot"
          git config user.email "sync@zonewise.ai"

      - name: Fetch Release Notes
        id: notes
        run: |
          UPSTREAM_TAG="${{ needs.sync.outputs.upstream_tag }}"
          DATE=$(date -u +%Y-%m-%d)
          VERSION="${UPSTREAM_TAG#v}"
          ZW_VERSION="2.${VERSION#0.}"

          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "zw_version=$ZW_VERSION" >> $GITHUB_OUTPUT

          curl -s "https://api.github.com/repos/lukilabs/craft-agents-oss/releases/latest" | jq -r '.body // "No release notes"' > /tmp/upstream_notes.txt

      - name: Generate Release Doc
        run: |
          mkdir -p docs/releases
          DATE="${{ steps.notes.outputs.date }}"
          ZW_VERSION="${{ steps.notes.outputs.zw_version }}"
          UPSTREAM_TAG="${{ needs.sync.outputs.upstream_tag }}"

          cat > "docs/releases/ZONEWISE_V${ZW_VERSION}_RELEASE_${DATE}.md" << EOF
          # ZoneWise V${ZW_VERSION} Release Notes
          **Date:** ${DATE}
          **Upstream:** Craft Agents OSS ${UPSTREAM_TAG}
          **Previous fork version:** v${{ needs.sync.outputs.fork_version }}
          **Status:** Synced & Deployed

          ## Upstream Changes
          $(cat /tmp/upstream_notes.txt)

          ## ZoneWise Integration
          - Desktop: zonewise-desktop (Electron)
          - Web: zonewise.ai
          - Backend: Supabase Edge Functions

          *Auto-generated by ZoneWise Sync Bot*
          EOF

          git add docs/releases/
          git commit -m "release: ZoneWise V${ZW_VERSION} (upstream ${UPSTREAM_TAG})" || echo "No changes"
          git push origin main || echo "Push skipped"

      - name: Create GitHub Release
        run: |
          ZW_TAG="v${{ steps.notes.outputs.zw_version }}"

          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://api.github.com/repos/breverdbidder/zonewise-desktop/releases/tags/${ZW_TAG}")

          if [ "$EXISTS" = "200" ]; then
            echo "Release ${ZW_TAG} already exists. Skipping."
            exit 0
          fi

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/breverdbidder/zonewise-desktop/releases" \
            -d "{
              \"tag_name\": \"${ZW_TAG}\",
              \"name\": \"ZoneWise ${ZW_TAG} (Craft Agents ${{ needs.sync.outputs.upstream_tag }})\",
              \"body\": \"Upstream sync with Craft Agents ${{ needs.sync.outputs.upstream_tag }}.\\nSee docs/releases/ for full notes.\",
              \"draft\": false,
              \"prerelease\": false
            }"

  notify:
    needs: [sync, release-doc]
    if: always() && needs.sync.outputs.synced == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Telegram — Sync Success
        if: needs.release-doc.result == 'success'
        run: |
          UPSTREAM_TAG="${{ needs.sync.outputs.upstream_tag }}"
          FORK_WAS="v${{ needs.sync.outputs.fork_version }}"
          BEHIND="${{ needs.sync.outputs.behind_count }}"

          MSG="⛰️ *UPSTREAM SYNC COMPLETE*

🔄 Craft Agents: \`${FORK_WAS}\` → \`${UPSTREAM_TAG}\`
📊 Merged: ${BEHIND} commits
📦 Release doc generated

🔗 [View Releases](https://github.com/breverdbidder/zonewise-desktop/releases)
🔗 [Upstream](https://github.com/lukilabs/craft-agents-oss/releases/tag/${UPSTREAM_TAG})

⏰ $(TZ=America/New_York date '+%I:%M %p EST')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true"

      - name: Telegram — Sync Failed
        if: needs.release-doc.result == 'failure' || needs.sync.result == 'failure'
        run: |
          MSG="🚨 *UPSTREAM SYNC FAILED*

❌ Craft Agents sync to zonewise-desktop failed
🏷️ Upstream: \`${{ needs.sync.outputs.upstream_tag }}\`
📋 Fork was: \`v${{ needs.sync.outputs.fork_version }}\`

⚠️ Manual merge may be required.
🔗 [View Workflow](https://github.com/breverdbidder/zonewise-desktop/actions/workflows/sync-upstream.yml)

⏰ $(TZ=America/New_York date '+%I:%M %p EST')"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true"

      - name: Notify zonewise-web
        if: needs.release-doc.result == 'success'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/dispatches" \
            -d "{
              \"event_type\": \"upstream-synced\",
              \"client_payload\": {
                \"upstream_tag\": \"${{ needs.sync.outputs.upstream_tag }}\",
                \"synced_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }
            }" || echo "zonewise-web dispatch failed (non-critical)"

      - name: Log to Supabase
        if: always()
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            curl -s -X POST \
              "${{ secrets.SUPABASE_URL }}/rest/v1/insights" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"type\": \"upstream_sync\",
                \"data\": {
                  \"upstream_tag\": \"${{ needs.sync.outputs.upstream_tag }}\",
                  \"fork_was\": \"v${{ needs.sync.outputs.fork_version }}\",
                  \"behind_count\": ${{ needs.sync.outputs.behind_count }},
                  \"synced\": true,
                  \"sync_result\": \"${{ needs.release-doc.result }}\",
                  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                }
              }" > /dev/null 2>&1 || true
          fi

  # Heartbeat — notify if upstream has new release but sync hasn't run
  parity-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: Alert if behind and sync failed
        if: needs.sync.outputs.has_new_release == 'true' && needs.sync.outputs.synced != 'true'
        run: |
          MSG="⚠️ *PARITY DRIFT DETECTED*

🏷️ Upstream: \`${{ needs.sync.outputs.upstream_tag }}\`
📋 Fork: \`v${{ needs.sync.outputs.fork_version }}\`
📊 Behind: ${{ needs.sync.outputs.behind_count }} commits

Sync did not execute. Check workflow.
🔗 [Fix it](https://github.com/breverdbidder/zonewise-desktop/actions/workflows/sync-upstream.yml)"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true"
