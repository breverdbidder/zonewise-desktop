categories:
  zoning: "Zoning code analysis and regulations"
  visualization: "3D visualization and rendering"
  analysis: "Property and environmental analysis"
  data: "External data source integration"
  county: "Per-county FL zoning intelligence (67 counties, CrossBeam 3-mode pattern)"

disclosure_levels:
  level_1:
    name: "Metadata"
    tokens: "50 per county, 50-150 per core skill"
    loaded: "Always — all 79 skill descriptions in system prompt"
  level_2:
    name: "Instructions"
    tokens: "800-1500 per county SKILL.md"
    loaded: "On-demand: when county name detected in user query"
  level_3:
    name: "Live Data"
    tokens: "Runtime Supabase REST query results"
    loaded: "On-demand via zonewise-supabase source"

tool_search:
  header: advanced-tool-use-2025-11-20
  defer_loading: true
  county_tools: deferred  # ~67 tools deferred until county detected
  max_tools: 10000

agents:
  orchestrator: {skills: ["zoning-analysis", "county-*"], routes: "address → co_no → county skill"}
  county_research: {skills: ["county-{slug}"], pattern: "CrossBeam 3-mode"}
  valuation: {skills: ["property-valuation", "bcpao-integration", "county-brevard"]}
  visualization: {skills: ["envelope-development", "sun-analysis", "threejs-*", "mapbox-integration"]}

pipeline:
  schedule: daily 23:00 EST
  executor: Modal.com (67 parallel containers)
  orchestrator: LangGraph (zonewise-agents Render)
  action: .github/workflows/nightly-county-scrape.yml
  circuit_breaker: 3 failures → insights table ESCALATE → Traycer GitHub Issue